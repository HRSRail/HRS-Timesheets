<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRS Rail Management Accounts</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>body{margin:0;font-family:Arial;background:#f3f4f4;color:#25292b}header{background:#202426;color:white;padding:22px;border-bottom:5px solid #8bbd23}.head,.wrap{max-width:1250px;margin:auto}.wrap{padding:22px 16px}.card{background:white;border:1px solid #d8dcde;border-radius:10px;padding:18px;margin-bottom:15px}.hidden{display:none}.muted{color:#6b7377;font-size:13px}input{width:100%;padding:10px;border:1px solid #cbd0d2;border-radius:6px;box-sizing:border-box}label{font-size:12px;font-weight:bold;display:block;margin-bottom:5px}button{border:0;border-radius:6px;padding:10px 14px;font-weight:bold;cursor:pointer}.green{background:#8bbd23}.dark{background:#2d3235;color:white}.light{background:#eceeef}.red{background:#fff0ef;color:#b42318;border:1px solid #f3c3bf}.portal-tabs{display:flex;gap:8px;margin-bottom:18px}.portal-tab{display:inline-block;padding:11px 16px;border-radius:7px;text-decoration:none;font-weight:bold;background:white;color:#25292b;border:1px solid #d8dcde}.portal-tab.active{background:#2d3235;color:white;border-color:#2d3235}.top{display:flex;justify-content:space-between;align-items:center}.controls{display:grid;grid-template-columns:200px 1fr auto auto;gap:10px;align-items:end}.dayinfo{background:#f7f8f8;padding:10px;border-radius:6px;font-size:13px}.ot{border:1px solid #d8dcde;border-radius:8px;padding:12px;margin-top:10px}.actions{display:flex;gap:7px;margin-top:8px}.APPROVED{color:#4e7607;font-weight:bold}.REJECTED{color:#b42318;font-weight:bold}.PENDING{font-weight:bold}@media(max-width:700px){.controls{grid-template-columns:1fr}.top{display:block}}</style></head><body><header><div class="head"><b style="font-size:25px">HRS RAIL</b><div>Management Timesheet Accounts</div></div></header><div class="wrap"><div class="portal-tabs"><a class="portal-tab" href="../index.html">OPERATIVE TIMESHEETS</a><a class="portal-tab active" href="./index.html">MANAGEMENT TIMESHEETS</a></div><div id="loginView" class="card" style="max-width:450px;margin:45px auto"><h2>Accounts Login</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><br><br><label>Password</label><input id="password" type="password" required><br><br><button class="green" style="width:100%">LOGIN TO ACCOUNTS</button></form><p id="loginMsg"></p></div><div id="dashboard" class="hidden"><div class="top"><div><h1>Management Timesheets</h1><div id="user" class="muted"></div></div><button id="logoutBtn" class="dark">LOG OUT</button></div><div class="card controls"><div><label>Timesheet Month</label><input id="month" type="month"></div><div><label>Search</label><input id="searchBox" placeholder="Employee, job number or location"></div><button id="refreshBtn" class="light">REFRESH</button><button id="excelBtn" class="green">DOWNLOAD APPROVED OT EXCEL</button></div><p id="status"></p><div id="list"></div></div></div><script>
const U="https://ihvpvtymlquntajbsvrx.supabase.co",K="sb_publishable_lTdwf5SjJfogmd-umaAtsg_z9xpJuOe",F=U+"/functions/v1/management-accounts-timesheets",sb=supabase.createClient(U,K),g=x=>document.getElementById(x);let rows=[];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"),fd=s=>new Date(s+"T12:00").toLocaleDateString("en-GB");
async function sess(){return (await sb.auth.getSession()).data.session}async function api(b){const s=await sess();if(!s)throw Error("Login expired.");const r=await fetch(F,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token,apikey:K},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||"Request failed");return j}
g("loginForm").onsubmit=async e=>{e.preventDefault();const {data,error}=await sb.auth.signInWithPassword({email:g("email").value.trim(),password:g("password").value});if(error){g("loginMsg").textContent=error.message;return}if(data.session)show()};g("logoutBtn").onclick=async()=>{await sb.auth.signOut();g("dashboard").classList.add("hidden");g("loginView").classList.remove("hidden")};
function nowMonth(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}async function show(){let s=await sess();if(!s)return;g("loginView").classList.add("hidden");g("dashboard").classList.remove("hidden");g("user").textContent=s.user.email||"";if(!g("month").value)g("month").value=nowMonth();load()}
async function load(){g("status").textContent="Loading...";try{let j=await api({action:"list",month:g("month").value});rows=j.timesheets;render();g("status").textContent=""}catch(e){g("status").textContent=e.message}}
function hrs(a,b){let x=a.split(":").map(Number),y=b.split(":").map(Number),n=y[0]*60+y[1]-x[0]*60-x[1];if(n<=0)n+=1440;return(n/60).toFixed(1)}
function render(){let q=g("searchBox").value.toLowerCase();let a=rows.filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q));g("list").innerHTML=a.length?a.map(t=>{let ch=t.management_day_records.filter(d=>d.changed_salary_shift),ot=t.management_overtime_shifts;return '<div class="card"><h2>'+esc(t.employee_name)+'</h2><div class="muted">Month: '+fd(t.timesheet_month)+' • Submitted: '+new Date(t.submitted_at).toLocaleString("en-GB")+'</div><div class="dayinfo"><b>Salary / leave:</b> '+t.management_day_records.length+' weekday records'+(ch.length?'<br><b>Changed salary/site:</b> '+ch.map(d=>fd(d.work_date)+' – '+esc(d.job_name_location)+' | '+esc(d.job_number)+' | '+d.start_time.slice(0,5)+'–'+d.end_time.slice(0,5)).join("<br>"):"")+'</div><h3>Overtime</h3>'+(ot.length?ot.map(o=>'<div class="ot"><b>'+fd(o.shift_date)+' – '+o.overtime_type+'</b><br>'+esc(o.job_name_location)+' | '+esc(o.job_number)+'<br>'+o.start_time.slice(0,5)+'–'+o.end_time.slice(0,5)+' ('+hrs(o.start_time,o.end_time)+' hrs)<br><span class="'+o.approval_status+'">'+o.approval_status+'</span>'+(o.rejection_reason?'<br>'+esc(o.rejection_reason):'')+(o.approval_status==="PENDING"?'<div class="actions"><button class="green" onclick="review(\''+o.id+'\',true)">APPROVE</button><button class="red" onclick="review(\''+o.id+'\',false)">REJECT</button></div>':'')+'</div>').join(""):'<span class="muted">No overtime claimed.</span>')+'</div>'}).join(""):'<div class="card muted">No management timesheets found.</div>'}
async function review(id,ok){let reason=null;if(!ok){reason=prompt("Reason for rejecting this overtime shift:");if(!reason||!reason.trim())return}try{await api({action:ok?"approve_overtime":"reject_overtime",shift_id:id,reason});load()}catch(e){alert(e.message)}}
function excel(){let x=[];for(let t of rows)for(let o of t.management_overtime_shifts)if(o.approval_status==="APPROVED")x.push({Employee:t.employee_name,Date:fd(o.shift_date),"OT Type":o.overtime_type,"Job / Location":o.job_name_location,"Job Number":o.job_number,Start:o.start_time.slice(0,5),Finish:o.end_time.slice(0,5),Hours:Number(hrs(o.start_time,o.end_time)),Approval:o.approval_status});if(!x.length){alert("No approved overtime shifts to export.");return}let ws=XLSX.utils.json_to_sheet(x),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Approved Overtime");XLSX.writeFile(wb,"HRS Management Approved OT - "+g("month").value+".xlsx")}
g("refreshBtn").onclick=load;g("month").onchange=load;g("searchBox").oninput=render;g("excelBtn").onclick=excel;(async()=>{if(await sess())show()})();
</script></body></html>
